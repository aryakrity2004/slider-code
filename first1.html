<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
margin: 0;
padding: 0;
box-sizing: border-box;
        }
        .container{
            display: flex;
            justify-content: space-between;
            margin:50px ;
        }
        .card{
            /* border: 2px solid red; */
            background-color: red;
            height: 200px;
            width: 200px;
            font-size: 30px;
            text-align: center;
            color: white;
        }
        .active{
            background-color: teal;
            border-radius: 10px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 80px;
        }
    </style>
    <title>Document</title>
</head>
<body>
     <div class="container">
        <div class="card" onclick="stylechange(this)">1</div>
        <div class="card" onclick="stylechange(this)">2</div>
        <div class="card" onclick="stylechange(this)">3</div>
        <div class="card" onclick="stylechange(this)">4</div>
    </div>
    <script>
        let cards = document.querySelectorAll(".card");
        // function stylechange(){
        //     // for(let elem of cards){
        //     //     elem.classList.toggle("active");
        //     // }
        // }
         function stylechange(element){
           for(ele of cards){
            ele.classList.remove("active");
           }
element.classList.toggle("active");
         }
    </script>
</body>
</html>
