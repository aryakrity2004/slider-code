<script>
    let leftbtn=document.querySelector("#leftbtn");
    let righttbtn=document.querySelector("#rightbtn");
    let slider=document.querySelector(".firstcontainer");
    
     function updateButtons() {
            leftbtn.disabled = slider.scrollLeft <= 0;
            rightbtn.disabled = slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 1;
        }

        // Initial check
        updateButtons();
    
    
rightbtn.addEventListener(
    "click",
     function() {
    slider.scrollBy({
        left: 220*3,
        behavior: "smooth"
           // scroll right
       
    });
     rightbtn.disabled = slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 1;
});
leftbtn.addEventListener(
    "click", 
function() {
    slider.scrollBy({
        left: -220*3,
        behavior: "smooth"
           // scroll left
    });
     leftbtn.disabled = slider.scrollLeft <= 0;
    

});
 // Update buttons after scroll (continuous tracking)
     slider.addEventListener("scroll", updateButtons);
</script>
