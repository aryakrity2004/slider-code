<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
        padding:0;
        margin:0;
        box-sizing:border-box;
        }
        body{
            background-color: skyblue;
            transition: transform 1s ease;
            overflow: hidden;

        }
        .container{
            position: fixed;
            width: 300px;
            height: 100vh;
            position: absolute;
            top: 0px;
            right: 0px;
            background-color: lavenderblush;
            transform: translateX(100%);
            transition: all 0.6s ease;
  
           
        }
        .container.active{
            transform: translateX(0);
            overflow: hidden;
        }
        h1{
            text-align: center;
            color: blue;
            position: absolute;
            top: 30%;
            left: 0px;
            padding: 20px;
            font-size: 50px;
        }
       
        #btn{
            background: none;
            font-size: 20px;
            font-weight: bold;
            position: fixed;
            border: none;
            margin: 15px;
            color: gray;
            cursor: pointer;
        }
        .btn{
            background: blue;
            font-size: 20px;
            font-weight: bold;
            position: fixed;
            position: absolute;
            top: 0px;
            right: 0px;
            height: 40px;
            width: 130px;
            border-radius: 20px;
            border: none;
            margin: 15px;
            color: white;
            padding: 10px;
            cursor: pointer;
        }
    </style>
    <title>side-Bar</title>
</head>
<body>
    <button class="btn">Add</button>
    <div class="container">
<button id="btn">X</button>
<h1>Hello Guy's</h1>
    </div>
</body>
<script>
    let btn=document.querySelector("#btn");
    let button=document.querySelector(".btn");
    let container=document.querySelector(".container");
    btn.addEventListener(
        "click",
        function(){
            
          container.classList.remove("active");
        }
    )
    button.addEventListener(
        "click",
        function(){
            
            container.classList.add("active");
        }
    )
</script>
</html>
